<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set a New Password | HorizonView</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-section {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            background: #f7f6f1;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            padding: 40px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.08);
        }

        .login-card h1 {
            color: #173d2b;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .login-intro {
            color: #666;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .login-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #173d2b;
        }

        .login-form input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #d8ded8;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .login-form input:focus {
            outline: 2px solid #a8c5ae;
            border-color: #173d2b;
        }

        .login-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #173d2b;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-submit:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .login-submit:hover {
            background: #24583d;
        }

        .login-links {
            text-align: center;
            margin-top: 24px;
            color: #666;
            line-height: 2;
        }

        .login-links a {
            color: #173d2b;
            font-weight: 600;
            text-decoration: none;
        }

        .login-message {
            margin-top: 15px;
            color: #9b3a24;
            font-size: 14px;
        }

        .login-message.ok {
            color: #173d2b;
            font-weight: 600;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">HorizonView</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="packages.html">Packages</a>
            <a href="start-project.html">Start a Project</a>
        </nav>
    </header>

    <main class="login-section">
        <section class="login-card">
            <h1>Set a new password</h1>
            <p class="login-intro">
                You opened a one-time reset link. Choose a new password
                of at least 8 characters. The link can be used only
                once and expires one hour after it was created.
            </p>

            <form class="login-form" id="resetForm">
                <label for="newPassword">New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    name="new_password"
                    placeholder="At least 8 characters"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="100"
                    required
                >

                <label for="confirmPassword">Confirm New Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirm_password"
                    placeholder="Type it again"
                    autocomplete="new-password"
                    minlength="8"
                    maxlength="100"
                    required
                >

                <button type="submit" class="login-submit">Save New Password</button>

                <p id="resetMessage" class="login-message" role="status"></p>
            </form>

            <div class="login-links">
                <p><a href="login.html">Back to login</a></p>
            </div>
        </section>
    </main>

    <script>
        const resetForm = document.getElementById("resetForm");
        const resetMessage = document.getElementById("resetMessage");
        const resetButton = resetForm.querySelector("button[type=submit]");

        resetForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            resetMessage.textContent = "";

            if (newPassword !== confirmPassword) {
                resetMessage.textContent = "The two passwords are not the same. Please type them again.";
                return;
            }

            resetButton.disabled = true;
            resetMessage.textContent = "Saving your new password...";

            // The token arrives as ?token=... at the end of the link
            // the administrator handed over.
            const params = new URLSearchParams(window.location.search);
            const token = params.get("token") || "";

            try {
                const response = await fetch("/api/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        token: token,
                        new_password: newPassword
                    })
                });

                let data = null;
                try {
                    data = await response.json();
                } catch (parseError) {
                    data = null;
                }

                if (response.ok) {
                    resetMessage.classList.add("ok");
                    resetMessage.textContent = data && data.message
                        ? data.message
                        : "Password changed.";
                    resetForm.reset();
                    // Do not leave a consumed token in the address bar.
                    window.history.replaceState(null, "", "/reset-password.html");
                    return;
                }

                resetMessage.textContent = data && data.message
                    ? data.message
                    : "Reset failed. Please try again.";

            } catch (networkError) {
                resetMessage.textContent =
                    "Could not reach the HorizonView server. If you are running the site yourself, make sure the server is started.";
            } finally {
                resetButton.disabled = false;
            }
        });
    </script>

</body>
</html>
