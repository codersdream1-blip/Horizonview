<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HorizonView</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-section {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 20px;
            background: #f7f6f1;
        }

        .login-card {
            width: 100%;
            max-width: 460px;
            padding: 40px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.08);
        }

        .login-card h1 {
            color: #173d2b;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .login-intro {
            color: #666;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .login-form label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #173d2b;
        }

        .login-form input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #d8ded8;
            border-radius: 7px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .login-form input:focus {
            outline: 2px solid #a8c5ae;
            border-color: #173d2b;
        }

        .login-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 7px;
            background: #173d2b;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-submit:hover {
            background: #24583d;
        }

        .login-links {
            text-align: center;
            margin-top: 24px;
            color: #666;
            line-height: 2;
        }

        .login-links a {
            color: #173d2b;
            font-weight: 600;
            text-decoration: none;
        }

        .login-message {
            margin-top: 15px;
            color: #9b3a24;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">HorizonView</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="packages.html">Packages</a>
            <a href="start-project.html">Start a Project</a>
        </nav>
    </header>

    <main class="login-section">
        <section class="login-card">
            <h1>Welcome back</h1>
            <p class="login-intro">
                Log in to view your projects, track construction progress,
                and stay connected with HorizonView.
            </p>

            <form class="login-form" id="loginForm">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="submit" class="login-submit">Log In</button>

                <p id="loginMessage" class="login-message" role="status"></p>
            </form>

            <div class="login-links">
                <p><a href="forgot-password.html">Forgot your password?</a></p>
                <p>New to HorizonView? <a href="register.html">Create an account</a></p>
            </div>
        </section>
    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginMessage = document.getElementById("loginMessage");
        const loginButton = loginForm.querySelector("button[type=submit]");

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            loginButton.disabled = true;
            loginMessage.textContent = "Checking your details...";

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email, password: password })
                });

                if (response.ok) {
                    window.location.href = "/dashboard";
                    return;
                }

                let data = null;
                try {
                    data = await response.json();
                } catch (parseError) {
                    data = null;
                }

                loginMessage.textContent = data && data.message
                    ? data.message
                    : "Log in failed. Please try again.";

            } catch (networkError) {
                loginMessage.textContent =
                    "Could not reach the HorizonView server. If you are running the site yourself, make sure the server is started.";
            } finally {
                loginButton.disabled = false;
            }
        });

        // "Forgot your password?" is now a real page (see the link
        // above); no stub needed here.
    </script>

</body>
</html>
